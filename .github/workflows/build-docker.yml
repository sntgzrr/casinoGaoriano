name: Build and Test Docker Compose
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker and Docker Compose
        run: |
          docker version
          docker compose version

      - name: Create .env files for backend
        run: |
          cat > back/.env << 'EOF'
          DEBUG=False
          SECRET_KEY=django-insecure-test-key-change-in-production
          ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
          CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
          CORS_ALLOW_CREDENTIALS=True
          
          # Database Configuration (PostgreSQL)
          DATABASE_URL=postgresql://casino_user:casino_pass@db:5432/casino_db
          DB_HOST=db
          DB_PORT=5432
          POSTGRES_DB=casino_db
          POSTGRES_USER=casino_user
          POSTGRES_PASSWORD=casino_pass
          EOF
          cat back/.env

      - name: Create .env files for frontend
        run: |
          cat > front/.env.production << 'EOF'
          VITE_API_URL=http://localhost:8000
          EOF
          cat front/.env.production

      - name: Build Docker images
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build

      - name: Start Docker services
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
          echo "Waiting for PostgreSQL to be ready..."
          sleep 5

      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend to be ready..."
          max_attempts=30
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            if curl -sf http://localhost:8000/api/ > /dev/null 2>&1; then
              echo "✓ Backend is ready!"
              break
            fi
            echo "⏳ Attempt $attempt/$max_attempts: Backend not ready, waiting..."
            sleep 2
            attempt=$((attempt + 1))
          done
          if [ $attempt -gt $max_attempts ]; then
            echo "✗ Backend failed to start after ${max_attempts} attempts"
            exit 1
          fi

      - name: Check running containers
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml ps

      - name: Verify backend health
        run: |
          echo "Testing backend connectivity..."
          curl -v http://localhost:8000/api/ || echo "✗ Backend unreachable"

      - name: Verify database connection
        run: |
          echo "Testing database connection..."
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T db pg_isready -U casino_user -d casino_db || echo "⚠ Database health check failed"

      - name: View backend logs
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs back
          echo ""
          echo "=== Database Logs ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs db
          echo ""
          echo "=== All Container Logs ==="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs

      - name: Stop and clean up services
        if: always()
        run: |
          echo "Stopping and cleaning up..."
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
          echo "✓ Services stopped and cleaned up"
