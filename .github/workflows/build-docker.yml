name: Build and Test Docker Compose
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker and Docker Compose
        run: |
          docker version
          docker compose version

      - name: Create .env files for backend
        run: |
          cat > back/.env << 'EOF'
          DEBUG=False
          SECRET_KEY=django-insecure-test-key-change-in-production
          ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
          CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
          CORS_ALLOW_CREDENTIALS=True
          
          # Database Configuration (PostgreSQL)
          DATABASE_URL=postgresql://casino_user:casino_pass@db:5432/casino_db
          DB_HOST=db
          DB_PORT=5432
          POSTGRES_DB=casino_db
          POSTGRES_USER=casino_user
          POSTGRES_PASSWORD=casino_pass
          EOF
          cat back/.env

      - name: Create .env files for frontend
        run: |
          cat > front/.env.production << 'EOF'
          VITE_API_URL=http://localhost:8000
          EOF
          cat front/.env.production

      - name: Build Docker images
        run: docker compose --env-file back/.env build

      - name: Start Docker services in detached mode
        run: docker compose --env-file back/.env up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for backend to be ready..."
          for i in {1..30}; do
            if curl -f http://localhost:8000/api/ 2>/dev/null; then
              echo "Backend is ready!"
              break
            fi
            echo "Attempt $i: Backend not ready, waiting..."
            sleep 2
          done

      - name: Check running containers
        run: docker compose --env-file back/.env ps

      - name: Verify backend health
        run: |
          echo "Testing backend connectivity..."
          curl -v http://localhost:8000/api/ || echo "✗ Backend unreachable"

      - name: Verify database connection
        run: |
          source back/.env
          echo "Testing database connection with user: $POSTGRES_USER, db: $POSTGRES_DB"
          docker compose --env-file back/.env exec -T db pg_isready -U $POSTGRES_USER -d $POSTGRES_DB || echo "⚠ Database health check failed"

      - name: View logs on failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker compose --env-file back/.env logs back
          echo ""
          echo "=== Database Logs ==="
          docker compose --env-file back/.env logs db

      - name: Stop and clean up services
        if: always()
        run: |
          docker compose --env-file back/.env down -v
          echo "✓ Services stopped and cleaned up"
