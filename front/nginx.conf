server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------
    add_header X-Content-Type-Options   "nosniff"         always;
    add_header X-Frame-Options          "SAMEORIGIN"      always;
    add_header X-XSS-Protection         "1; mode=block"   always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------------
    # API proxy → Django / Gunicorn backend
    # Requests to /api/* are forwarded to the backend service.
    # The BACKEND_URL variable is injected at container start-up via
    # envsubst (see Dockerfile) or defaults to the production hostname.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass         https://casinogaoriano-production.up.railway.app;
        proxy_http_version 1.1;

        # Preserve the original host so Django ALLOWED_HOSTS matches
        proxy_set_header   Host              casinogaoriano-production.up.railway.app;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Forward cookies so JWT cookie-based auth works end-to-end
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;

        # CORS headers — allow the frontend origin to send credentialed requests
        set $cors_origin "";
        if ($http_origin ~* "^https://frontend-production-45e0\.up\.railway\.app$") {
            set $cors_origin $http_origin;
        }

        add_header Access-Control-Allow-Origin      $cors_origin         always;
        add_header Access-Control-Allow-Credentials "true"               always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-CSRFToken" always;

        # Handle pre-flight OPTIONS requests without hitting the backend
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials "true"       always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-CSRFToken" always;
            add_header Content-Length 0;
            add_header Content-Type   text/plain;
            return 204;
        }
    }

    # -------------------------------------------------------------------------
    # SPA fallback — React Router handles client-side routing
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Static asset caching
    # -------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

