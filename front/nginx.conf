server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy all /api/* requests to the Django backend
    location /api/ {
        # Handle pre-flight OPTIONS requests locally — no need to hit the backend
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Type, X-CSRFToken, X-Requested-With" always;
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass http://casinogaoriano-production.up.railway.app:8000;

        # Preserve the original host so Django's ALLOWED_HOSTS matches
        proxy_set_header Host casinogaoriano-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forward cookies to the backend and pass Set-Cookie back to the browser
        proxy_pass_header Set-Cookie;
        proxy_set_header Cookie $http_cookie;

        # CORS headers on actual responses
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Type, X-CSRFToken, X-Requested-With" always;

        proxy_http_version 1.1;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Serve the React SPA — React Router handles client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
