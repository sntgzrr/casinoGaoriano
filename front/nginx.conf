server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # API proxy → Django / Gunicorn backend
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backEnd.railway.internal:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              backEnd.railway.internal;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;

        # CORS — handled by Django; add a permissive fallback here
        add_header Access-Control-Allow-Origin      "*"                                       always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS"  always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-CSRFToken" always;

        # Short-circuit pre-flight requests without touching the backend
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # -------------------------------------------------------------------------
    # SPA fallback — React Router handles client-side routing
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Static asset caching
    # -------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

